name: LOL 韩服主播每日战报

on:
  schedule:
    # UTC 21:00 = Asia/Shanghai 次日 05:00
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "统计日期（YYYY-MM-DD，留空则取上海时区的前一天）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lol-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
          fi

      - name: 生成战报
        env:
          TZ: Asia/Shanghai
          INPUT_DATE: ${{ inputs.date }}
        run: |
          target="${INPUT_DATE:-$(date -d 'yesterday' +%F)}"
          echo "统计日期: ${target}"
          echo "TARGET_DATE=${target}" >> "$GITHUB_ENV"
          python src/main.py --date "${target}"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lol-daily-report-${{ env.TARGET_DATE }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
