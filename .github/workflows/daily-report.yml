name: LOL 韩服主播每日战报

on:
  schedule:
    # UTC 21:00 = Asia/Shanghai 次日 05:00
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "统计日期（YYYY-MM-DD，留空则取上海时区的前一天）"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lol-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
          fi

      - name: 生成战报
        env:
          TZ: Asia/Shanghai
          INPUT_DATE: ${{ inputs.date }}
        run: |
          target="${INPUT_DATE:-$(date -d 'yesterday' +%F)}"
          echo "统计日期: ${target}"
          echo "TARGET_DATE=${target}" >> "$GITHUB_ENV"
          python src/main.py --date "${target}"

      - name: 提交产物到仓库（PR 自动合并）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="output/${TARGET_DATE}"

          # 同名分支已存在时基于它追加提交（fast-forward），避免覆盖历史
          git fetch origin "${branch}" >/dev/null 2>&1 || true
          if git rev-parse --verify --quiet "origin/${branch}" >/dev/null; then
            git checkout -B "${branch}" "origin/${branch}"
          else
            git checkout -B "${branch}" main
          fi

          git add output/
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
            exit 0
          fi

          git commit -m "战报产物：${TARGET_DATE}"
          git push origin "${branch}"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "战报产物：${TARGET_DATE}" \
            --body "每日战报自动生成（output/），由 Actions 自动合并。" \
            || echo "PR 已存在或无差异，跳过创建"

          # 仅在存在 open PR 时执行自动合并
          pr_number=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')
          if [ -z "${pr_number}" ] || [ "${pr_number}" = "null" ]; then
            echo "无可合并的 open PR（可能已合并），跳过"
            exit 0
          fi

          # 优先排队自动合并（启用分支保护时等待检查）；未开启 auto-merge 时直接合并
          gh pr merge "${pr_number}" --auto --squash --delete-branch \
            || gh pr merge "${pr_number}" --squash --delete-branch

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lol-daily-report-${{ env.TARGET_DATE }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
