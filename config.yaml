timezone: Asia/Shanghai
schedule:
  cron_utc: "0 21 * * *"
  description: "每天 05:00（Asia/Shanghai）运行"

accounts:
  - display_name: "余小C"
    riot_id: "斗鱼丶胡凯利#2862"
    region: "kr"
    enabled: true
  - display_name: "洞主"
    riot_id: "热心市民张合#65360"
    provider: "sqgg"
    server: "艾欧尼亚"
    environment: "HN1"
    enabled: true
  - display_name: "凯哥"
    riot_id: "我心如铁石#43240"
    provider: "sqgg"
    server: "艾欧尼亚"
    environment: "HN1"
    enabled: true

sqgg:
  email_env: "SQGG_EMAIL"
  password_env: "SQGG_PASSWORD"
  token_env: "SQGG_TOKEN"
  count_per_page: 20
  max_pages: 5
  timeout: 30
  retries: 2
  reserve_seconds: 300
  token_cache: ".cache/sqgg-session.json"

report:
  output_dir: "output"
  minimum_games_for_judgement: 3
  source_label: "OP.GG"
  render_image: true
  auto_update_champions: true
